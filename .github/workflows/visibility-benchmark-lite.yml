name: Visibility Benchmark Lite tests
on:
  pull_request:
    paths:
      - "tools/visibility-benchmark-lite/**"
      - ".github/workflows/visibility-benchmark-lite.yml"
  push:
    paths:
      - "tools/visibility-benchmark-lite/**"
      - ".github/workflows/visibility-benchmark-lite.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tools/visibility-benchmark-lite/test/engine.test.cjs
