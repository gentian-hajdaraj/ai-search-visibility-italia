name: Sync canonical public data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download canonical public assets
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://telescop.it/research/ai-search-visibility-italia"
          OUT="data/release-v1.0"

          mkdir -p "$OUT"

          curl -fL --retry 3 --connect-timeout 15             "$BASE/methodology/data/panel-500.csv"             -o "$OUT/panel-500.csv"

          curl -fL --retry 3 --connect-timeout 15             "$BASE/data/research-summary-v1.0.json"             -o "$OUT/research-summary-v1.0.json"

          curl -fL --retry 3 --connect-timeout 15             "$BASE/methodology/data/manifest.json"             -o "$OUT/manifest.json"

          curl -fL --retry 3 --connect-timeout 15             "$BASE/methodology/data/SHA256SUMS.txt"             -o "$OUT/SHA256SUMS.txt"

      - name: Verify frozen panel
        shell: bash
        run: |
          set -euo pipefail

          FILE="data/release-v1.0/panel-500.csv"
          EXPECTED="c39b8f8e201bad7718d8233d3c7563f7a115530fb55bd293a18982c7665ac214"
          ACTUAL="$(sha256sum "$FILE" | awk '{print $1}')"
          LINES="$(wc -l < "$FILE" | tr -d ' ')"
          BYTES="$(stat -c '%s' "$FILE")"

          test "$ACTUAL" = "$EXPECTED"
          test "$LINES" = "501"
          test "$BYTES" = "42866"

          echo "panel_sha256=$ACTUAL"
          echo "panel_lines=$LINES"
          echo "panel_bytes=$BYTES"

      - name: Validate JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("data/release-v1.0")
          for name in ("manifest.json", "research-summary-v1.0.json"):
              with (root / name).open("r", encoding="utf-8") as fh:
                  value = json.load(fh)
              if not isinstance(value, dict):
                  raise SystemExit(f"{name}: expected JSON object")
              print(f"[OK] {name}")
          PY

      - name: Record provenance
        shell: bash
        run: |
          cat > data/release-v1.0/PROVENANCE.md <<'EOF'
          # Provenance — v1.0 public mirror

          These files are byte-for-byte downloads from the public Telescop Research endpoints associated with:

          **AI Search Visibility in Italia — Dataset e metodologia v1.0**

          DOI: https://doi.org/10.5281/zenodo.22640375

          The workflow verifies `panel-500.csv` against the frozen SHA-256 published with the methodology:

          `c39b8f8e201bad7718d8233d3c7563f7a115530fb55bd293a18982c7665ac214`

          The DOI-backed Zenodo record remains the canonical archival release.
          EOF

      - name: Commit verified mirror
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- data/release-v1.0 &&              git ls-files --error-unmatch data/release-v1.0/panel-500.csv >/dev/null 2>&1; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/release-v1.0
          git commit -m "Mirror verified public research data v1.0"
          git push
