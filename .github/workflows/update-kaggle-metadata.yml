name: Update Kaggle metadata

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-kaggle-metadata.yml"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Fetch and enrich Kaggle metadata
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "${KAGGLE_API_TOKEN:-}" || {
            echo "Missing GitHub secret KAGGLE_API_TOKEN" >&2
            exit 1
          }

          DATASET="gentianhajdaraj/ai-search-visibility-italia"
          OUT="build/kaggle-metadata"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          kaggle datasets metadata "$DATASET" -p "$OUT"

          python - "$OUT/dataset-metadata.json" <<'PY'
          import json, sys
          p = sys.argv[1]
          with open(p, "r", encoding="utf-8") as fh:
              data = json.load(fh)

          print("Server license metadata:", data.get("licenses"))

          data["expectedUpdateFrequency"] = "annually"
          data["userSpecifiedSources"] = """Original research produced by **Gentian Hajdaraj / Telescop Research**.

- Canonical archived release: https://doi.org/10.5281/zenodo.22640375
- Public research report: https://telescop.it/research/ai-search-visibility-italia/
- Methodology: https://telescop.it/research/ai-search-visibility-italia/methodology/
- GitHub companion: https://github.com/gentian-hajdaraj/ai-search-visibility-italia
- ORCID: https://orcid.org/0009-0003-6955-460X

The Kaggle dataset is a distribution mirror of selected public v1.0 research assets. The DOI-backed Zenodo record remains the canonical archival reference."""

          desired = {
              "panel_id": "Stable panel identifier.",
              "panel_type": "Panel type: nonbranded or control.",
              "sector": "Research sector.",
              "intent": "Research intent classification.",
              "brand": "Seeded brand for control queries; empty for non-branded queries.",
              "query": "Italian-language query in the frozen research panel.",
              "volume": "Search-volume field used during deterministic panel construction.",
              "keyword_id": "Internal source keyword identifier."
          }

          resources = data.get("resources") or []
          for resource in resources:
              if resource.get("path") == "panel-500.csv":
                  resource["description"] = "Frozen 500-query Italian research panel used in AI Search Visibility in Italia 2026."
                  schema = resource.setdefault("schema", {})
                  fields = schema.get("fields") or []
                  for field in fields:
                      name = field.get("name")
                      if name in desired:
                          field["description"] = desired[name]
                          field["title"] = desired[name]
              elif resource.get("path") == "research-summary-v1.0.json":
                  resource["description"] = "Machine-readable aggregate results used by the public research report."
              elif resource.get("path") == "manifest.json":
                  resource["description"] = "Frozen panel methodology, quota and integrity manifest."

          with open(p, "w", encoding="utf-8") as fh:
              json.dump(data, fh, ensure_ascii=False, indent=2)
              fh.write("\n")
          PY

          kaggle datasets metadata "$DATASET" --update -p "$OUT"
          echo "Metadata updated: https://www.kaggle.com/datasets/$DATASET"