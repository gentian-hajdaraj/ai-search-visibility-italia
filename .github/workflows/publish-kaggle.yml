name: Publish Kaggle dataset

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-kaggle.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Prepare Kaggle package
        shell: bash
        run: |
          set -euo pipefail

          OUT="build/kaggle"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          cp data/release-v1.0/panel-500.csv "$OUT/"
          cp data/release-v1.0/research-summary-v1.0.json "$OUT/"
          cp data/release-v1.0/manifest.json "$OUT/"
          cp distribution/kaggle/dataset-metadata.json "$OUT/dataset-metadata.json"

          sha256sum "$OUT/panel-500.csv"

      - name: Publish dataset
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "${KAGGLE_API_TOKEN:-}" || {
            echo "Missing GitHub secret KAGGLE_API_TOKEN" >&2
            exit 1
          }

          DATASET="gentianhajdaraj/ai-search-visibility-italia"
          OUT="build/kaggle"

          if kaggle datasets status "$DATASET" >/dev/null 2>&1; then
            kaggle datasets version               -p "$OUT"               -m "Sync AI Search Visibility in Italia v1.0"               -q -t -r skip
          else
            kaggle datasets create               -p "$OUT"               --public               -q -t -r skip
          fi

          kaggle datasets status "$DATASET"
